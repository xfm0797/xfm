{% extend "base.html" %}
{% block main %}
<article class="page">
  <header class="post-header"><h1>{{ page.title }}</h1>
  {% if site.description %}<p class="lead">{{ site.description }}</p>{% endif %}</header>
  <div class="prose">{{ content | safe }}</div>
  <section class="list"><h2>目录</h2>
  <ul class="page-list">
  {% for g in site.navGroups %}{% for item in g.items %}<li><a href="{{ item.url }}">{{ item.title }}</a><span class="dim">{{ g.title }}</span></li>
  {% endfor %}{% endfor %}
  </ul></section>
</article>
{% endblock %}
