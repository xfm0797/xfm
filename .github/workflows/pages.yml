name: Deploy example site

# 把 examples/blog 构建后部署到 GitHub Pages。
# 仓库是项目页（<owner>.github.io/<repo>/），构建时通过 SITE_BASE 注入子路径，
# 由引擎的 site.base 直接生成带前缀的链接（0.4.0 起，不再有构建后补前缀的脚本）。

on:
  push:
    branches: [main]
    paths:
      - 'examples/blog/**'
      - 'lib/**'
      - 'bin/**'
      - 'themes/**'
      - 'packages/**'
      - 'test/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 同一时间只允许一个部署；取消进行中的会留下半截产物，所以排队而不是打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 同 CI：仓库不提交 lockfile，setup-node 的 cache: npm 会报错，改用显式缓存
      - name: Restore npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package.json', 'packages/*/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-

      # 项目页是 /<repo>/，用户根站（<owner>.github.io）是 /
      - name: Resolve Pages base and URL
        run: |
          repo="${{ github.event.repository.name }}"
          owner="${{ github.repository_owner }}"
          if [ "$repo" = "$owner.github.io" ]; then
            echo "SITE_BASE=/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://$owner.github.io" >> "$GITHUB_ENV"
          else
            echo "SITE_BASE=/$repo/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://$owner.github.io/$repo" >> "$GITHUB_ENV"
          fi

      # 内核零依赖；这里装的是 packages/ 下各个插件包（npm workspaces 会就地软链）
      - name: Link workspace plugins
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: node test/run.js

      - name: Build example site
        run: node bin/xfm.js build examples/blog

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # 首次运行时仓库还没开 Pages，试着用工作流令牌自动启用；
          # 若仓库策略不允许，去 Settings → Pages 把 Source 选为 GitHub Actions
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: examples/blog/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
