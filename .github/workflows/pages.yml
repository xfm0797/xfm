name: Deploy example site

# 把 examples/blog 构建后部署到 GitHub Pages。
# 仓库是项目页（<owner>.github.io/<repo>/），所以构建后调用 scripts/pages-base.js
# 补子路径前缀——引擎尚未支持 site.base 前缀，这是临时步骤，详见脚本头部说明。

on:
  push:
    branches: [main]
    paths:
      - 'examples/blog/**'
      - 'lib/**'
      - 'bin/**'
      - 'themes/**'
      - 'test/**'
      - 'scripts/pages-base.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 同一时间只允许一个部署；取消进行中的会留下半截产物，所以排队而不是打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 项目页是 /<repo>/，用户根站（<owner>.github.io）是 /
      - name: Resolve Pages base and URL
        run: |
          repo="${{ github.event.repository.name }}"
          owner="${{ github.repository_owner }}"
          if [ "$repo" = "$owner.github.io" ]; then
            echo "SITE_BASE=/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://$owner.github.io" >> "$GITHUB_ENV"
          else
            echo "SITE_BASE=/$repo/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://$owner.github.io/$repo" >> "$GITHUB_ENV"
          fi

      # 零依赖项目，不需要 npm ci
      - name: Run tests
        run: node test/run.js

      - name: Build example site
        run: node bin/xfm.js build examples/blog

      - name: Prefix links for project Pages
        run: node scripts/pages-base.js examples/blog/dist "$SITE_BASE"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行时仓库还没开 Pages，试着用工作流令牌自动启用；
          # 若仓库策略不允许，去 Settings → Pages 把 Source 选为 GitHub Actions
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/blog/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
