name: Desktop Release

# 桌面端（xfm-desktop）多平台编译流水线：
#   - 推送 xfm-desktop 分支 / PR：只编译并上传 Actions 产物，便于验证；
#   - 推送 v* 标签 / 手动触发指定标签：把各平台压缩包附加到 GitHub Release。
#
# 产物布局统一为：
#   xfm-linux-amd64.tar.gz    { xfm, themes/ }
#   xfm-darwin-arm64.tar.gz   { xfm, themes/ }
#   xfm-darwin-amd64.tar.gz   { xfm, themes/ }
#   xfm-windows-amd64.zip     { xfm.exe, themes/ }
# 主题放在二进制旁的 themes/ 目录，运行时由 assets.ThemeResolver 自动发现。

on:
  push:
    branches: [xfm-desktop]
    tags: ['v*', 'desktop-v*']
  pull_request:
    branches: [xfm-desktop]
    paths:
      - 'xfm-desktop/**'
      - 'themes/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  CGO_ENABLED: '1'

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: ubuntu-22.04 }
          # macos-latest 为 Apple Silicon，同一 runner 交叉编译 x86_64
          - { name: darwin, os: macos-latest }
          - { name: windows-amd64, os: windows-latest }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: xfm-desktop/go.mod
          cache-dependency-path: xfm-desktop/go.sum

      # Fyne 依赖 OpenGL / X11 / Wayland 头文件
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: xfm-desktop
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p ../stage/linux-amd64
          go build -trimpath -ldflags "-s -w" -o ../stage/linux-amd64/xfm .
          cp -R ../themes ../stage/linux-amd64/themes

      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: xfm-desktop
        run: |
          mkdir -p ../stage/darwin-arm64 ../stage/darwin-amd64
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w" -o ../stage/darwin-arm64/xfm .
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -arch x86_64" \
            go build -trimpath -ldflags "-s -w" -o ../stage/darwin-amd64/xfm .
          cp -R ../themes ../stage/darwin-arm64/themes
          cp -R ../themes ../stage/darwin-amd64/themes

      # Windows 走 MSYS2 的 mingw-w64 工具链，CGO 才能编译 GLFW
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: xfm-desktop
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          export PATH="/mingw64/bin:$PATH"
          mkdir -p ../stage/windows-amd64
          go build -trimpath -ldflags "-s -w" -o ../stage/windows-amd64/xfm.exe .

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C stage/linux-amd64 -czf xfm-linux-amd64.tar.gz .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          tar -C stage/darwin-arm64 -czf xfm-darwin-arm64.tar.gz .
          tar -C stage/darwin-amd64 -czf xfm-darwin-amd64.tar.gz .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Recurse themes stage/windows-amd64/themes
          Compress-Archive -Path stage/windows-amd64/* -DestinationPath xfm-windows-amd64.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xfm-desktop-${{ matrix.name }}
          path: |
            xfm-*.tar.gz
            xfm-*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
